<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Datos</title>
        <link rel="stylesheet" href="CSS/font.css">
        <link rel="stylesheet" href="CSS/datos.css">
    </head>
    <body>
        <main id="main-datos">
            <div id="principal-datos">
                <h1>Ingresa tus datos</h1>
                <h2>Datos necesarios para crear cuenta.</h2>
            </div>
            
            <form id="datos-datos">

                    <label for="password">Ingresa tu contraseña</label>
                    <input type="password" required placeholder="Escribe tu contraseña" minlength="3" id="password" name="password">
                    <label for="fecha">Ingresa tu fecha de nacimiento</label>
                    <input type="date" required name="fecha" id="fecha">
                    <label for="steam">Ingresa el enlace a tu cuenta de steam</label>
                    <input type="url" required placeholder="Usuario de Steam" id="steam" name="steam">
                    <label for="documento">Ingresa tu DNI o pasaporte (Sin puntos)</label>
                    <input type="text" required placeholder="ID" id="documento" name="documento">
                    <label for="color">Elige el color de tu cuenta</label>
                    <input type="color" name="color" id="color">
                    <label for="file1">Documento parte delantera</label>
                    <input type="file" required id="file1" name="file1">
                    <label for="file2">Documento parte trasera</label>
                    <input type="file" required id="file2" name="file2">
                    <input type="button" value="boton" id="boton" name="boton">
                    <label for="img">Foto de cara</label>
                    <input type="file" required name="img" id="img">
                    <label for="tel">Ingrese su numero de telefono</label>
                    <input type="tel" required name="tel" id="tel">

                    <label for="condiciones">¿Acepta los terminos y condiciones?</label>
                    <input type="checkbox" id="condiciones" name="condiciones" required>
                    <label for="reiniciar">Restablecer campos por defecto</label>
                    <input type="reset" value="Reiniciar" name="reiniciar" id="reiniciar">
                    <label for="enviar">Enviar</label>
                    <input type="submit" value="Enviar" name="enviar" id="enviar">
                    
            </form>
            <form class="inicio-de-sesion">
                            <label for="inicio-de-sesion">¿Tienes una cuenta?</label>
                            
                <h2 id="ISmenu">Inicia Sesion</h2>
                <input type="email" placeholder="Correo Electronico" id="inicio-mail">
                <input type="password" placeholder="Contraseña" id="inicio-pass">
                <input type="submit" value="Enviar" id="inicio-enviar">
            </form>
        </main>

    <footer id="footer-datos">
        <div id="titulo.datos">
            <h2>Tus videojuegos</h2>
            <nav>
                <a href="index.html" title="Ir al menu">Ir al menu</a>
            </nav>
        </div>

        <address id="contacto">
            <a href="mailto:example@gmail.com" title="Ir a Gmail">Contactanos al mail</a>
            <a href="tel:543849485627" title="Ir a contactos">Contactanos por telefono</a>
        </address>
    </footer>
    </body>
</html>

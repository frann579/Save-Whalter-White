    <h1>Sándwich de jamón y queso</h1>
    <h2>Receta</h2>
    <ol>
        <li>Colocá jamón y queso entre dos rebanadas de pan.</li>
        <li>Calentá el sándwich en una sartén o sandwichera hasta que el queso se derrita.</li>
        <li>Retiralo, cortalo por la mitad y servilo.</li>
    </ol>
